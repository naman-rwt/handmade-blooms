{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>Admin Login 🔐</h1>

    {% if error %}

    <p>
        <strong>{{ error }}</strong>
    </p>

    {% endif %}

    <form method="POST">

        <label>Admin Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter admin password"
            required
        >

        <button type="submit">
            Login 🔐
        </button>

    </form>

</div>

{% endblock %}
