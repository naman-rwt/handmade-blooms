{% extends "base.html" %}

{% block content %}

<style>

.account-page {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

.account-card {
    background: white;
    border-radius: 22px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    border: 1px solid #f4dce5;
}

.account-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.account-card h1 {
    margin: 0;
    color: #333;
}

.account-card p {
    color: #777;
    margin: 10px 0 25px;
}

.account-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.account-button {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
}

.orders-button {
    background: #ff6fa5;
    color: white;
}

.track-button {
    background: #fff0f5;
    color: #e84f88;
    border: 1px solid #ffc5d8;
}

@media (max-width: 600px) {

    .account-page {
        margin: 25px auto;
        padding: 15px;
    }

    .account-card {
        padding: 30px 18px;
    }

    .account-buttons {
        flex-direction: column;
    }

    .account-button {
        width: 100%;
        box-sizing: border-box;
    }

}

</style>


<div class="account-page">

    <div class="account-card">

        <div class="account-icon">
            👤
        </div>

        <h1>
            My Account
        </h1>

        <p>
            Welcome to Handmade Blooms 🌸
        </p>

        <div class="account-buttons">

            <a
                href="/my_orders"
                class="account-button orders-button"
            >
                📦 My Orders
            </a>

            <a
                href="/track_order"
                class="account-button track-button"
            >
                🚚 Track Order
            </a>

        </div>

    </div>

</div>

{% endblock %}
